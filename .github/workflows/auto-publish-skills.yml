name: Auto Publish Claude Skills

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Generate Skills Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_skills.py
      - name: Commit & Push
        run: |
          git config user.name "ClaudeHub Bot"
          git config user.email "bot@claudehub.ai"
          git add content/claude-skills/ processed-skills.json
          git diff --cached --quiet || git commit -m "Auto: Claude skills [$(date +%Y-%m-%d)]"
          git push
